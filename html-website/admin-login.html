<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Edathara Kudumbayogam</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { maroon: '#800000', gold: '#FFD700' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #111827; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-900 relative overflow-hidden">
    <!-- Background design -->
    <div class="absolute inset-0 opacity-30 mix-blend-overlay">
        <img src="https://images.unsplash.com/photo-1594957608244-3d02bf16a504?q=80&w=2000&auto=format&fit=crop" class="w-full h-full object-cover">
    </div>
    
    <div class="relative z-10 w-full max-w-md px-4">
        <div class="glass-card rounded-[2rem] shadow-2xl p-8 border border-white/20">
            <div class="text-center mb-8">
                <img src="logo.png" alt="Logo" class="h-16 mx-auto mb-4 drop-shadow-md">
                <h1 class="text-2xl font-heading font-bold text-gray-900">Admin Portal</h1>
                <p class="text-sm text-gray-500 mt-1 font-medium tracking-wide uppercase">Authorized Access Only</p>
            </div>
            
            <form id="admin-login-form" class="space-y-6">
                <div id="error-container" class="hidden bg-red-50 border border-red-200 p-4 rounded-xl">
                    <div class="flex items-center">
                        <i class="fa-solid fa-circle-exclamation text-red-500 mr-2"></i>
                        <p id="error-text" class="text-sm text-red-700 font-medium"></p>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Administrator Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="email" required class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-maroon focus:border-maroon transition-all font-medium" placeholder="admin@edathara.com">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Master Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" required class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-maroon focus:border-maroon transition-all font-medium" placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" id="submit-btn" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shield-halved text-gold"></i> Secure Login
                </button>
                
                <div class="text-center mt-6">
                    <a href="index.html" class="text-sm text-gray-500 hover:text-maroon font-medium transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Return to Main Website</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'admin-dashboard.html';
            }
        });

        const form = document.getElementById('admin-login-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorContainer = document.getElementById('error-container');
        const errorText = document.getElementById('error-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorContainer.classList.add('hidden');
            
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            submitBtn.disabled = true;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                errorContainer.classList.remove('hidden');
                
                switch (error.code) {
                    case 'auth/invalid-email': errorText.innerText = 'Invalid email format.'; break;
                    case 'auth/user-not-found': errorText.innerText = 'No admin account found with this email.'; break;
                    case 'auth/wrong-password': 
                    case 'auth/invalid-credential': errorText.innerText = 'Incorrect master password.'; break;
                    default: errorText.innerText = 'Authentication failed. Please try again.';
                }
            }
        });
    </script>
</body>
</html>
